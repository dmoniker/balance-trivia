<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
    />
    <link rel="icon" href="favicon.png" type="image/png" />
    <title>Balance & Trivia</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preload" as="video" type="video/mp4" href="single-leg-left-old.mp4" />
  </head>
  <body>
    <div class="shell">
      <div class="screen active" id="intro-section">
        <div class="intro-hero">
          <video autoplay muted loop playsinline preload="auto">
            <source src="single-leg-left-old.mp4" type="video/mp4" />
          </video>
          <div class="intro-badge">Trivia & Balance</div>
          <div class="intro-heading">
            <h1>Stand.<br /><span>Think.</span></h1>
          </div>
        </div>
        <div class="intro-body">
          <div class="diff-row">
            <a class="diff-card sel" id="cardTandem" href="game-tandem.html">
              <div class="diff-mode easy">Tandem</div>
              <div class="diff-desc">Heel-to-toe stance. Great for building stability.</div>
            </a>
            <a class="diff-card" id="cardSingle" href="game-single-leg.html">
              <div class="diff-mode hard">Single Leg</div>
              <div class="diff-desc">One foot only. Maximum challenge mode.</div>
            </a>
          </div>
          <div class="rules-grid">
            <div class="rule-chip"><b>→ Answer</b>Correct: keep your stance</div>
            <div class="rule-chip"><b>⇄ Switch</b>Wrong: swap feet</div>
            <div class="rule-chip"><b>⏱ 2 min</b>Stay balanced throughout</div>
            <div class="rule-chip"><b>★ Score</b>+1 per right answer</div>
          </div>
          <a class="btn-begin" id="beginBtn" href="game-tandem.html" style="text-align: center; text-decoration: none; display: block;">Begin →</a>
        </div>
      </div>
    </div>
    <script>
      document.getElementById("cardTandem").addEventListener("click", function (e) {
        e.preventDefault();
        document.getElementById("cardTandem").classList.add("sel");
        document.getElementById("cardSingle").classList.remove("sel");
        document.getElementById("beginBtn").href = "game-tandem.html";
      });
      document.getElementById("cardSingle").addEventListener("click", function (e) {
        e.preventDefault();
        document.getElementById("cardSingle").classList.add("sel");
        document.getElementById("cardTandem").classList.remove("sel");
        document.getElementById("beginBtn").href = "game-single-leg.html";
      });
    </script>
  </body>
</html>
